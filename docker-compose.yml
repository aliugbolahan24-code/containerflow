services:
  web:
    image: nginx
    ports:
      - "8081:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      APP_MESSAGE: "Hello from Docker backend!"

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data

volumes:
  redis-data: